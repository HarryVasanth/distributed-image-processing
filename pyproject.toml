[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-image-processing"
version = "2.0.0"
description = "Distribute OpenCV image processing across Celery workers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.12"
authors = [{ name = "Harry Vasanth", email = "hello@harryvasanth.com" }]
keywords = ["celery", "opencv", "image-processing", "distributed"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "celery==5.5.3",
  "numpy==2.4.6",
  "opencv-python-headless==4.12.0.88",
  "redis==5.2.1",
  "requests==2.32.5",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.14.9",
]

[project.scripts]
imageproc = "imageproc.client:main"

[tool.setuptools.packages.find]
include = ["imageproc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
