name: 💄 Format Code Base

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: 💄 Format Code Base
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: 🐧 Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 🐍 Format Python with Ruff
        run: |
          pip install ruff==0.17.6
          ruff check --fix .
          ruff format .

      - name: 💄 Format Markdown and YAML
        run: npx --yes prettier@3 --write "**/*.{md,yml,yaml,json}"

      - name: 📎 Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(codebase): format with ruff and prettier"
